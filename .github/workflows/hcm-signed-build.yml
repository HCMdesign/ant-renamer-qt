# HCM-only workflow (not upstream). v1.3.0, 2026-11-24.
#   1.3.0: trust the pinned HCM root on the signing runners so signtool embeds the chain; require Status Valid.
#   1.2.0: embed the HCM intermediate in the signature (signtool /ac); without it Windows cannot chain to the root.
#   1.1.0: key isolated from build code (four jobs); secrets moved to the hcm-codesign environment.
#   1.0.0: first version (single job).
#
# Builds the Windows packages from an hcm/v*-signed branch (cut from an upstream release tag) and
# Authenticode-signs antrenamer-qt.exe and the setup.exe with the HCM Development Code Signing
# certificate (issued offline by the HCM step-ca intermediate; root trusted on HCM devices via GPO).
# The Inno Setup uninstaller and the Qt/MinGW DLLs are left unsigned (third-party code).
#
# Trust model: the certificate is valid on every HCM device, so the key never shares a job with repo
# code or build tools. build and package (repo code, MSYS2, Inno Setup) have no secrets; sign-exe and
# sign-setup only download artifacts and run signtool, with no checkout. Secrets CERTIFICATE (base64 PFX
# incl. intermediate) and CERTIFICATE_PASS live in the hcm-codesign environment, which releases them only
# to hcm/v*-signed branches; a repository ruleset lets only admins create or push those branches.
# Upstream's build.yml is untouched.
name: HCM signed Windows build

on:
  push:
    branches: ['hcm/v*-signed']
  workflow_dispatch:

permissions:
  contents: read

env:
  # Public HCM step-ca root certificate (DER, base64): not a secret. Trusted on HCM devices via GPO.
  HCM_ROOT_SHA256: eec3cd82fbbfd1f682fa2987fe88ebd855f95a5a9f88d9dd9dfa7a858d47cb03
  HCM_ROOT_B64: 

jobs:
  build:
    name: Build and test (no secrets)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: MSYS2 (MinGW + Qt 6)
        id: msys2
        uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools

      - name: Build
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\windows\vscode-mingw.ps1 build
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Tests (engine)
        shell: msys2 {0}
        timeout-minutes: 5
        run: ctest --test-dir build-mingw -R core --output-on-failure

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-unsigned
          retention-days: 1
          path: |
            build-mingw/app
            !build-mingw/app/CMakeFiles
            !build-mingw/app/*_autogen

  sign-exe:
    name: Sign the program (no checkout)
    needs: build
    if: startsWith(github.ref, 'refs/heads/hcm/v') && endsWith(github.ref, '-signed')
    runs-on: windows-2022
    timeout-minutes: 10
    environment: hcm-codesign
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: app-unsigned
          path: app

      - name: Sign antrenamer-qt.exe
        shell: pwsh
        env:
          CERT: ${{ secrets.CERTIFICATE }}
          CERT_PASS: ${{ secrets.CERTIFICATE_PASS }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'hcm-codesign.pfx'
          try {
            if (-not $env:CERT) { Write-Error 'CERTIFICATE secret is missing'; exit 1 }
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT))
            # signtool builds the chain from the runner's stores, which lack the HCM intermediate: pass it with /ac
            # so it is embedded (HCM devices trust only the root, via GPO).
            $col = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2Collection
            $col.Import($pfx, $env:CERT_PASS.Trim(), [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
            $ica = $col | Where-Object { $_.Extensions | Where-Object { $_ -is [System.Security.Cryptography.X509Certificates.X509BasicConstraintsExtension] -and $_.CertificateAuthority } } | Select-Object -First 1
            if (-not $ica) { Write-Error 'the PFX holds no intermediate CA certificate'; exit 1 }
            $icaFile = Join-Path $env:RUNNER_TEMP 'hcm-intermediate.cer'
            [IO.File]::WriteAllBytes($icaFile, $ica.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
            # signtool embeds only a chain that ends at a root trusted on the signing machine: trust the HCM root on
            # this throwaway runner, after checking it is the real one (public cert, pinned by its SHA-256).
            $root = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new([Convert]::FromBase64String($env:HCM_ROOT_B64))
            $fp = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($root.RawData)).ToLower()
            if ($fp -ne $env:HCM_ROOT_SHA256) { Write-Error "HCM root fingerprint mismatch: $fp"; exit 1 }
            $store = [System.Security.Cryptography.X509Certificates.X509Store]::new('Root', 'LocalMachine')
            $store.Open('ReadWrite'); $store.Add($root); $store.Close()
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -like '*x64*' } | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            & $signtool sign /f $pfx /p $env:CERT_PASS.Trim() /ac $icaFile /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 app\antrenamer-qt.exe
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: exe-signed
          retention-days: 1
          path: app/antrenamer-qt.exe

  package:
    name: Package from the signed program (no secrets)
    needs: sign-exe
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: app-unsigned
          path: build-mingw/app

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: exe-signed
          path: build-mingw/app

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Packages (portable zip + installer)
        shell: pwsh
        run: |
          $s = Get-AuthenticodeSignature build-mingw\app\antrenamer-qt.exe
          if ($s.SignerCertificate.Subject -notlike '*HCM Development Code Signing*') { Write-Error 'the exe to package is not the signed one'; exit 1 }
          powershell -ExecutionPolicy Bypass -File scripts\windows\package-win.ps1 -SkipBuild
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-unsigned-setup
          retention-days: 1
          path: |
            dist/*.zip
            dist/*-setup.exe

  sign-setup:
    name: Sign the installer and verify (no checkout)
    needs: package
    if: startsWith(github.ref, 'refs/heads/hcm/v') && endsWith(github.ref, '-signed')
    runs-on: windows-2022
    timeout-minutes: 10
    environment: hcm-codesign
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist-unsigned-setup
          path: dist

      - name: Sign the setup.exe
        shell: pwsh
        env:
          CERT: ${{ secrets.CERTIFICATE }}
          CERT_PASS: ${{ secrets.CERTIFICATE_PASS }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'hcm-codesign.pfx'
          try {
            if (-not $env:CERT) { Write-Error 'CERTIFICATE secret is missing'; exit 1 }
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT))
            # signtool builds the chain from the runner's stores, which lack the HCM intermediate: pass it with /ac
            # so it is embedded (HCM devices trust only the root, via GPO).
            $col = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2Collection
            $col.Import($pfx, $env:CERT_PASS.Trim(), [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
            $ica = $col | Where-Object { $_.Extensions | Where-Object { $_ -is [System.Security.Cryptography.X509Certificates.X509BasicConstraintsExtension] -and $_.CertificateAuthority } } | Select-Object -First 1
            if (-not $ica) { Write-Error 'the PFX holds no intermediate CA certificate'; exit 1 }
            $icaFile = Join-Path $env:RUNNER_TEMP 'hcm-intermediate.cer'
            [IO.File]::WriteAllBytes($icaFile, $ica.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
            # signtool embeds only a chain that ends at a root trusted on the signing machine: trust the HCM root on
            # this throwaway runner, after checking it is the real one (public cert, pinned by its SHA-256).
            $root = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new([Convert]::FromBase64String($env:HCM_ROOT_B64))
            $fp = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($root.RawData)).ToLower()
            if ($fp -ne $env:HCM_ROOT_SHA256) { Write-Error "HCM root fingerprint mismatch: $fp"; exit 1 }
            $store = [System.Security.Cryptography.X509Certificates.X509Store]::new('Root', 'LocalMachine')
            $store.Open('ReadWrite'); $store.Add($root); $store.Close()
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -like '*x64*' } | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            $setup = Get-ChildItem dist -Filter '*-setup.exe' | Select-Object -First 1 -ExpandProperty FullName
            if (-not $setup) { Write-Error 'setup.exe not built'; exit 1 }
            & $signtool sign /f $pfx /p $env:CERT_PASS.Trim() /ac $icaFile /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $setup
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Signer and hashes
        shell: pwsh
        run: |
          # The signing step trusted the HCM root on this runner, so Status must be Valid, as on an HCM device.
          Expand-Archive (Get-ChildItem dist -Filter '*-portable.zip').FullName -DestinationPath zipcheck
          $files = @((Get-ChildItem dist -Filter '*-setup.exe').FullName) + @((Get-ChildItem zipcheck -Recurse -Filter antrenamer-qt.exe).FullName)
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f
            Write-Host "$(Split-Path $f -Leaf): signer=$($s.SignerCertificate.Subject) timestamp=$($s.TimeStamperCertificate.Subject) status=$($s.Status)"
            if ($s.SignerCertificate.Subject -notlike '*HCM Development Code Signing*') { Write-Error "$f is not signed by HCM"; exit 1 }
            if (-not $s.TimeStamperCertificate) { Write-Error "$f has no timestamp"; exit 1 }
            if ($s.Status -ne 'Valid') { Write-Error "$f signature is $($s.Status): $($s.StatusMessage)"; exit 1 }
          }
          Get-FileHash dist\* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Tee-Object dist\SHA256SUMS-hcm.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-signed
          retention-days: 14
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/SHA256SUMS-hcm.txt
